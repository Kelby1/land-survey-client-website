<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional land surveying website draft for a surveying company."
    />
    <meta name="theme-color" content="#091412" />
    <title>SurveyCo | Land Surveying & Geomatics</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify form detection for the React quote form -->
    <form name="quote-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="location" />
      <select name="service"><option>General inquiry</option></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
